<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark"/>
  <title>The POT Player · SEBIV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #131211;
      --bg2: #1c1b19;
      --border: #2e2c29;
      --text: #f0ede8;
      --muted: #888580;
      --dim: #4a4742;
      --purple: #9B6FC6;
      --green: #77B777;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 48px;
      background: rgba(19,18,17,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo img { height: 28px; }
    .nav-back {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--purple); }

    /* MAIN STAGE */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 32px 48px;
      text-align: center;
      min-height: 100vh;
    }

    /* HOURGLASS */
    .hg-wrap {
      margin-bottom: 40px;
    }
    .hg-wrap svg {
      height: 64px;
      width: auto;
    }
    .hg-wrap.playing .hg-line {
      stroke: var(--purple);
    }
    @keyframes hg-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .hg-wrap.playing svg {
      animation: hg-pulse 2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .hg-wrap.playing svg { animation: none; }
    }

    /* SONG DISPLAY */
    .now-playing {
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .now-playing.fading { opacity: 0; }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .song-title {
      font-size: clamp(36px, 7vw, 80px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.0;
      margin-bottom: 12px;
      max-width: 800px;
    }

    .artist-name {
      font-size: clamp(14px, 2vw, 18px);
      color: var(--purple);
      letter-spacing: 0.06em;
      margin-bottom: 32px;
    }

    .journal-meta {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 48px;
    }
    .journal-meta a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .journal-meta a:hover { color: var(--muted); }

    /* SPOTIFY EMBED */
    .embed-wrap {
      width: 100%;
      max-width: 480px;
      margin-bottom: 40px;
      border-radius: 12px;
      overflow: hidden;
      transition: opacity 0.4s ease;
    }
    .embed-wrap.fading { opacity: 0; }
    .embed-wrap iframe {
      display: block;
      width: 100%;
      border: none;
    }

    .no-link-msg {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 28px;
      font-size: 13px;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.7;
    }
    .no-link-msg a {
      color: var(--purple);
      text-decoration: none;
    }
    .no-link-msg a:hover { text-decoration: underline; }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-shuffle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 14px 28px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-shuffle:hover { background: #b08ad6; }
    .btn-shuffle:active { transform: scale(0.97); }

    .btn-journal {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 14px 20px;
      border-radius: 3px;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-journal:hover {
      color: var(--text);
      border-color: var(--muted);
      text-decoration: none;
    }

    /* COUNTER */
    .counter {
      margin-top: 40px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 32px 48px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
    footer a { color: var(--muted); text-decoration: none; }

    @media (max-width: 640px) {
      nav { padding: 18px 24px; }
      .stage { padding: 100px 24px 40px; }
      .controls { flex-direction: column; gap: 12px; width: 100%; }
      .btn-shuffle, .btn-journal { width: 100%; justify-content: center; text-align: center; }
    }
  </style>
</head>

// ─── STATE ─────────────────────────────────────────────────────────────────
let currentIndex = null;
let played = new Set();

// ─── DOM ───────────────────────────────────────────────────────────────────
const hgWrap     = document.getElementById('hgWrap');
const nowPlaying = document.getElementById('nowPlaying');
const eyebrow    = document.getElementById('eyebrow');
const songTitle  = document.getElementById('songTitle');
const artistName = document.getElementById('artistName');
const journalMeta= document.getElementById('journalMeta');
const embedWrap  = document.getElementById('embedWrap');
const journalLink= document.getElementById('journalLink');
const counter    = document.getElementById('counter');

// ─── SHUFFLE ───────────────────────────────────────────────────────────────
function shuffle() {
  // Reset when all played
  if (played.size >= TRACKS.length) played.clear();

  let idx;
  do { idx = Math.floor(Math.random() * TRACKS.length); }
  while (played.has(idx) && played.size < TRACKS.length);

  played.add(idx);
  currentIndex = idx;
  playTrack(TRACKS[idx]);
}

function playTrack(t) {
  // Fade out
  nowPlaying.classList.add('fading');
  embedWrap.classList.add('fading');

  setTimeout(() => {
    // Update text
    eyebrow.textContent = t.date ? `Journal ${t.journal} · ${t.date}` : `Journal ${t.journal}`;
    songTitle.textContent = t.song;
    artistName.textContent = t.artist;

    const jNum = String(t.journal).padStart(2, '0');
    const jFile = `journal-${t.journal}.html`;
    journalMeta.innerHTML = t.journalTitle !== '—'
      ? `<a href="${jFile}">${t.journalTitle}</a>`
      : `<a href="${jFile}">Journal ${jNum}</a>`;
    journalLink.href = jFile;

    // Update embed
    if (t.spotifyId) {
      embedWrap.innerHTML = `<iframe
        src="https://open.spotify.com/embed/track/${t.spotifyId}?utm_source=generator&theme=0"
        height="152"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>`;
      embedWrap.style.display = 'block';
    } else {
      const searchQ = encodeURIComponent(`${t.song} ${t.artist}`);
      embedWrap.innerHTML = `<div class="no-link-msg">
        Spotify link not yet added for this track.<br>
        <a href="https://open.spotify.com/search/${searchQ}" target="_blank" rel="noopener noreferrer">
          Search "${t.song}" by ${t.artist} on Spotify →
        </a>
      </div>`;
      embedWrap.style.display = 'block';
    }

    counter.textContent = `${played.size} of ${TRACKS.length} played`;

    // Activate hourglass
    hgWrap.classList.add('playing');
    document.querySelectorAll('.hg-line').forEach(l => l.setAttribute('stroke', '#9B6FC6'));

    // Fade in
    nowPlaying.classList.remove('fading');
    embedWrap.classList.remove('fading');
  }, 380);
}

// Auto-shuffle on load
window.addEventListener('DOMContentLoaded', () => {
  counter.textContent = `${TRACKS.length} songs · shuffle to start`;
});
</script>
